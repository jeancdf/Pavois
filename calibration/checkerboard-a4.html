<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Damier calibration 9x6 — 25mm — A4 paysage</title>
<style>
  @page { size: A4 landscape; margin: 10mm; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .board {
    width: 250mm;   /* 10 colonnes x 25mm */
    height: 175mm;  /*  7 lignes  x 25mm */
    margin: 5mm auto;
    display: grid;
    grid-template-columns: repeat(10, 25mm);
    grid-template-rows: repeat(7, 25mm);
    border: 0;
  }
  .board div { width: 25mm; height: 25mm; }
  .b { background: #000; }
  .w { background: #fff; }
  .note { font: 3.5mm sans-serif; color: #444; text-align: center; margin-top: 2mm; }
  @media print { .note { display: none; } }
</style>
</head>
<body>
<div class="board" id="board"></div>
<p class="note">
  Imprimer depuis Chrome : Ctrl+P → Échelle « 100 % » (PAS « Ajuster à la page ») → A4 paysage.<br>
  Vérifier au réglet après impression : chaque case doit faire 25,0 mm.
  Coller sur un support rigide (carton, clipboard).
</p>
<script>
  const board = document.getElementById('board');
  for (let r = 0; r < 7; r++)
    for (let c = 0; c < 10; c++) {
      const d = document.createElement('div');
      d.className = (r + c) % 2 === 0 ? 'b' : 'w';
      board.appendChild(d);
    }
</script>
</body>
</html>
