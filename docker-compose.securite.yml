services:
  postgres-securite:
    image: postgres:16-alpine
    container_name: pavois-postgres-securite
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pavois}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-pavois}
    volumes:
      - pavois-postgres-securite-data:/var/lib/postgresql/data
    # Pas de "ports:" : accessible uniquement depuis le réseau Docker interne
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pavois}"]
      interval: 5s
      timeout: 5s
      retries: 10

  vps-server-securite:
    build:
      context: ./vps
      dockerfile: Dockerfile
    container_name: pavois-vps-server-securite
    restart: unless-stopped
    depends_on:
      postgres-securite:
        condition: service_healthy
    ports:
      - "41235:41234/udp"
      - "3003:3002/tcp"
    env_file:
      - ./vps/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pavois}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres-securite:5432/${POSTGRES_DB:-pavois}?schema=public
    volumes:
      # Positions des caméras (CAMERAS_FILE), seul dossier inscriptible avec read_only
      - pavois-securite-data:/app/data
    # SÉCURITÉ NIVEAU 2 & 3 : Confinement Docker Staging
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    cpus: 1.0

  frontend-angular-securite:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: pavois-frontend-angular-securite
    restart: unless-stopped
    depends_on:
      - vps-server-securite
    environment:
      PAVOIS_API_URL: ${PAVOIS_API_URL:-}
      PAVOIS_WS_BASE_URL: ${PAVOIS_WS_BASE_URL:-http://localhost:3003}
      PAVOIS_DEV_TOKEN: ${PAVOIS_DEV_TOKEN:-dev-pavois-token}
    ports:
      - "8081:80/tcp"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
      - /var/cache/nginx:exec,mode=1777
      - /var/run:exec,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 256m
    cpus: 0.5

volumes:
  pavois-securite-data:
  pavois-postgres-securite-data:
