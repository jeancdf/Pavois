name: Deploy OVH VPS (Achraf)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: Test the VPS backend
        working-directory: vps
        run: |
          npm i
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Test the Angular frontend
        working-directory: frontend-angular
        run: |
          npm i --legacy-peer-deps
          npm test

  deploy-ovh:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Une clé OpenSSH brute dans `env:` est coupée au premier saut de
      # ligne : OVH_KEY arrivait vide alors que le secret existait.
      # toJSON garde la clé sur une seule ligne, puis on reconstitue le PEM.
      - name: Write OVH SSH key
        env:
          SSH_KEY_JSON: ${{ toJSON(secrets.OVH_VPS_SSH_KEY) }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          raw = os.environ.get("SSH_KEY_JSON") or ""
          try:
              key = json.loads(raw) if raw else ""
          except json.JSONDecodeError:
              key = raw
          if not isinstance(key, str):
              key = ""
          key = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if "\n" not in key:
              key = key.replace("\\n", "\n")
          if not key.strip():
              sys.stderr.write(
                  "Secret OVH_VPS_SSH_KEY vide.\n"
              )
              sys.exit(1)
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              sys.stderr.write(
                  "OVH_VPS_SSH_KEY n'est pas une clé privée PEM/OpenSSH.\n"
              )
              sys.exit(1)
          if not key.endswith("\n"):
              key += "\n"
          ssh_dir = pathlib.Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          path = ssh_dir / "ovh_deploy"
          path.write_text(key, encoding="utf-8")
          path.chmod(0o600)
          info = subprocess.check_output(
              ["ssh-keygen", "-l", "-f", str(path)],
              text=True,
          ).strip()
          print(f"Clé SSH écrite ({len(key)} octets) : {info}")
          PY
      - name: Deploy to Achraf OVH VPS over SSH
        env:
          HOST: ${{ secrets.OVH_VPS_HOST || '51.91.98.159' }}
          SSH_USER: ${{ secrets.OVH_VPS_USER || 'ubuntu' }}
          PORT: ${{ secrets.OVH_VPS_PORT || 22 }}
          APP_DIR: ${{ secrets.OVH_VPS_APP_DIR || '/home/ubuntu/Pavois' }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
          DISCORD_CATEGORIES: ${{ vars.DISCORD_CATEGORIES }}
          DISCORD_MAX_ALERTS_PER_MIN: ${{ vars.DISCORD_MAX_ALERTS_PER_MIN }}
          DISCORD_MENTION_ROLE_ID: ${{ vars.DISCORD_MENTION_ROLE_ID }}
          DISCORD_INCLUDE_POSITION: ${{ vars.DISCORD_INCLUDE_POSITION }}
          DISCORD_ENV_LABEL: ${{ vars.DISCORD_ENV_LABEL }}
          OPERATOR_URL: ${{ vars.OPERATOR_URL }}
        run: |
          set -euo pipefail
          # Secrets pasted from Windows often carry CR / trailing spaces.
          HOST="${HOST//$'\r'/}"
          SSH_USER="${SSH_USER//$'\r'/}"
          PORT="${PORT//$'\r'/}"
          APP_DIR="${APP_DIR//$'\r'/}"
          HOST="${HOST#"${HOST%%[![:space:]]*}"}"
          HOST="${HOST%"${HOST##*[![:space:]]}"}"
          SSH_USER="${SSH_USER#"${SSH_USER%%[![:space:]]*}"}"
          SSH_USER="${SSH_USER%"${SSH_USER##*[![:space:]]}"}"
          PORT="${PORT#"${PORT%%[![:space:]]*}"}"
          PORT="${PORT%"${PORT##*[![:space:]]}"}"
          echo "SSH ${SSH_USER}@${HOST} port=${PORT} (user ${#SSH_USER} chars)"
          ssh -i "${HOME}/.ssh/ovh_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            -p "${PORT}" \
            "${SSH_USER}@${HOST}" \
            env \
              APP_DIR="${APP_DIR}" \
              BRANCH="${BRANCH}" \
              GH_TOKEN="${GH_TOKEN}" \
              REPO="${REPO}" \
              DISCORD_WEBHOOK_URL="${DISCORD_WEBHOOK_URL:-}" \
              DISCORD_ENABLED="${DISCORD_ENABLED:-}" \
              DISCORD_CATEGORIES="${DISCORD_CATEGORIES:-}" \
              DISCORD_MAX_ALERTS_PER_MIN="${DISCORD_MAX_ALERTS_PER_MIN:-}" \
              DISCORD_MENTION_ROLE_ID="${DISCORD_MENTION_ROLE_ID:-}" \
              DISCORD_INCLUDE_POSITION="${DISCORD_INCLUDE_POSITION:-}" \
              DISCORD_ENV_LABEL="${DISCORD_ENV_LABEL:-}" \
              OPERATOR_URL="${OPERATOR_URL:-}" \
              bash -s <<'REMOTE'
          set -euo pipefail
          echo "--> Déploiement de la branche '$BRANCH' sur le VPS OVH..."

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "--> Premier clonage du dépôt dans $APP_DIR..."
            mkdir -p "$(dirname "$APP_DIR")"
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch origin
          # Force-sync to origin. -f drops tracked local edits.
          # Untracked files such as .env are left untouched.
          git checkout -f -B "$BRANCH" "origin/$BRANCH"

          # Écriture sécurisée des variables Discord dans vps/.env
          python3 <<'PY'
          import os
          from pathlib import Path

          vps_dir = Path("vps")
          vps_dir.mkdir(exist_ok=True)
          env_path = vps_dir / ".env"
          example_path = vps_dir / ".env.example"

          if not env_path.exists():
              if example_path.exists():
                  env_path.write_text(example_path.read_text(encoding="utf-8"), encoding="utf-8")
              else:
                  env_path.touch()

          discord_vars = {
              "DISCORD_WEBHOOK_URL": os.environ.get("DISCORD_WEBHOOK_URL", ""),
              "DISCORD_ENABLED": os.environ.get("DISCORD_ENABLED", ""),
              "DISCORD_CATEGORIES": os.environ.get("DISCORD_CATEGORIES", ""),
              "DISCORD_MAX_ALERTS_PER_MIN": os.environ.get("DISCORD_MAX_ALERTS_PER_MIN", ""),
              "DISCORD_MENTION_ROLE_ID": os.environ.get("DISCORD_MENTION_ROLE_ID", ""),
              "DISCORD_INCLUDE_POSITION": os.environ.get("DISCORD_INCLUDE_POSITION", ""),
              "DISCORD_ENV_LABEL": os.environ.get("DISCORD_ENV_LABEL", ""),
              "OPERATOR_URL": os.environ.get("OPERATOR_URL", ""),
          }

          updates = {k: v for k, v in discord_vars.items() if v}

          lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []
          updated_lines = []
          seen_keys = set()

          for line in lines:
              stripped = line.strip()
              if stripped.startswith("#") or "=" not in stripped:
                  updated_lines.append(line)
                  continue
              key = stripped.split("=", 1)[0].strip()
              if key in updates:
                  updated_lines.append(f'{key}="{updates[key]}"')
                  seen_keys.add(key)
              elif key in discord_vars:
                  updated_lines.append(line)
                  seen_keys.add(key)
              else:
                  updated_lines.append(line)

          for key, val in updates.items():
              if key not in seen_keys:
                  updated_lines.append(f'{key}="{val}"')

          env_path.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")
          env_path.chmod(0o600)
          PY

          chmod +x scripts/deploy_staging.sh scripts/deploy_vps.sh \
            2>/dev/null || true

          ./scripts/deploy_staging.sh

          echo "--> Vérification des logs du conteneur VPS..."
          DOCKER_CMD="docker"
          if ! docker info >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          fi
          $DOCKER_CMD compose -f docker-compose.yml logs --tail=50 vps-server | grep -E "Discord :" || true
          REMOTE

