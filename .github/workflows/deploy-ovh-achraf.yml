name: Deploy OVH VPS (Achraf)

on:
  push:
    branches:
      - securite
      - main
  workflow_dispatch:

jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/securite'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: Test the VPS backend
        working-directory: vps
        run: |
          npm i
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Test the Angular frontend
        working-directory: frontend-angular
        run: |
          npm i --legacy-peer-deps
          npm test

  deploy-ovh:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Une clé OpenSSH brute dans `env:` est coupée au premier saut de
      # ligne : OVH_KEY arrivait vide alors que le secret existait.
      # toJSON garde la clé sur une seule ligne, puis on reconstitue le PEM.
      - name: Write OVH SSH key
        env:
          SSH_KEY_JSON: ${{ toJSON(secrets.OVH_VPS_SSH_KEY || secrets.VPS_SSH_KEY) }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          raw = os.environ.get("SSH_KEY_JSON") or ""
          try:
              key = json.loads(raw) if raw else ""
          except json.JSONDecodeError:
              key = raw
          if not isinstance(key, str):
              key = ""
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          if "\n" not in key.strip():
              key = key.replace("\\n", "\n")
          if not key.strip():
              sys.stderr.write(
                  "Clé SSH vide (OVH_VPS_SSH_KEY ou VPS_SSH_KEY).\n"
              )
              sys.exit(1)
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              sys.stderr.write(
                  "Le secret n'est pas une clé privée PEM/OpenSSH.\n"
              )
              sys.exit(1)
          if not key.endswith("\n"):
              key += "\n"
          ssh_dir = pathlib.Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          path = ssh_dir / "ovh_deploy"
          path.write_text(key, encoding="utf-8")
          path.chmod(0o600)
          print(f"Clé SSH écrite ({len(key)} octets).")
          PY
      - name: Deploy to Achraf OVH VPS over SSH
        env:
          HOST: ${{ secrets.OVH_VPS_HOST || secrets.VPS_HOST || '51.91.98.159' }}
          SSH_USER: ${{ secrets.OVH_VPS_USER || secrets.VPS_USER || 'ubuntu' }}
          PORT: ${{ secrets.OVH_VPS_PORT || secrets.VPS_PORT || 22 }}
          APP_DIR: ${{ secrets.OVH_VPS_APP_DIR || secrets.VPS_APP_DIR || '/home/ubuntu/Pavois' }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/ovh_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -p "${PORT}" \
            "${SSH_USER}@${HOST}" \
            env \
              APP_DIR="${APP_DIR}" \
              BRANCH="${BRANCH}" \
              GH_TOKEN="${GH_TOKEN}" \
              REPO="${REPO}" \
              bash -s <<'REMOTE'
          set -euo pipefail
          echo "--> Déploiement de la branche '$BRANCH' sur le VPS OVH..."

          if [ ! -d "$APP_DIR/.git" ]; then
            echo "--> Premier clonage du dépôt dans $APP_DIR..."
            mkdir -p "$(dirname "$APP_DIR")"
            git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" \
              "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch origin
          # Force-sync to origin. -f drops tracked local edits.
          # Untracked files such as .env are left untouched.
          git checkout -f -B "$BRANCH" "origin/$BRANCH"

          chmod +x scripts/deploy_staging.sh scripts/deploy_vps.sh \
            2>/dev/null || true

          ./scripts/deploy_staging.sh
          REMOTE
