name: Deploy VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: Test the VPS backend
        working-directory: vps
        run: |
          npm ci
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Test the Angular frontend
        working-directory: frontend-angular
        run: |
          npm ci --legacy-peer-deps
          npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            BASE_APP_DIR="${{ secrets.VPS_APP_DIR }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$BASE_APP_DIR" ]; then
              echo "VPS_APP_DIR secret is required" >&2
              exit 1
            fi

            # Déterminer le dossier cible et le fichier compose selon la branche
            if [ "$BRANCH" = "securite" ]; then
              TARGET_DIR="${BASE_APP_DIR}-securite"
              COMPOSE_FILE="docker-compose.securite.yml"
            else
              TARGET_DIR="${BASE_APP_DIR}"
              COMPOSE_FILE="docker-compose.yml"
            fi

            echo "--> Déploiement de la branche '$BRANCH' dans '$TARGET_DIR' avec $COMPOSE_FILE"

            # S'assurer que le dossier cible est un dépôt Git valide
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "--> Clonage du dépôt dans '$TARGET_DIR'..."
              rm -rf "$TARGET_DIR"
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_DIR" || git clone "git@github.com:${{ github.repository }}.git" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            if [ ! -d ".git" ]; then
              echo "Erreur : '$TARGET_DIR' n'est pas un dépôt Git valide." >&2
              exit 1
            fi

            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
            git fetch --all --prune
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"

            chmod +x scripts/deploy_vps.sh frontend-angular/docker-entrypoint.d/40-env-js.sh 2>/dev/null || true
            COMPOSE_FILE="$COMPOSE_FILE" APP_DIR="$TARGET_DIR" ./scripts/deploy_vps.sh
