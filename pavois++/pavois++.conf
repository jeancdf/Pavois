# ============================================================================
# Pavois++ runtime configuration
# Every key below is optional; the values shown are the built-in defaults unless
# noted. See IMPROVEMENT_PLAN.md / ARCHITECTURE.md for what each stage does.
# ============================================================================

# --- global runtime ---
frames=-1                       # -1 = run forever
processing_threads=3            # detector caller + two persistent helpers
runtime.pin_threads=true        # capture=CPU0, detector=CPU1, helpers=CPU2-3

# --- fusion (shared across cameras) ---
fusion_window_ms=20             # strict cross-camera capture-time alignment
fusion_emit_interval_ms=60      # one triangulation + one track emit per this
fusion_min_parallax_deg=2.0     # reject near-collinear camera pairs
fusion_max_residual_m=3.0       # reject a solution if ANY ray disagrees by more
fusion_max_range_m=60.0         # sanity cap on target distance
fusion_ransac_iterations=24

# --- tracking (constant-velocity Kalman per target) ---
track_match_distance_m=6.0      # normal association gate
track_process_noise=200.0       # higher = follows manoeuvres faster, less smooth
track_meas_noise=2.5
track_confirm_updates=3         # updates before a track is emitted
track_max_coast_ms=1200         # delete a track after this long with no update
track_max_speed_mps=120.0

# --- output ---
output_host=51.91.98.159
output_port=41234
# debug_dir=/tmp/pavois_debug   # dump frames/masks/overlays for tuning
# debug_every=15

# --- one-shot close-target classification ---
classification.enabled=true
classification.quality=90
classification.http_port=8081
classification.http_path=/api/classification/capture

# --- GPS reference (local ENU origin) ---
reference_lat=48.82608
reference_lon=2.36590
reference_alt=58.524

# ============================================================================
# Cameras
# device may be: /dev/videoN | rtsp://... | http://.../video | a replay dir
# Pose: heading_deg is a compass bearing (0=N, 90=E, clockwise);
#       elevation_deg is the optical-axis tilt above the horizon (+ up).
# ============================================================================

# --- Camera 0 ---
camera.0.id=cam0
camera.0.device=http://admin:admin@192.168.137.86:8081/video
camera.0.width=1280
camera.0.height=720
camera.0.limit_fps=false         # CSI maximum, including legacy field configs
camera.0.fps=0                   # only used when limit_fps=true
camera.0.startup_calibration_ms=1500
camera.0.manual_exposure=false
camera.0.fov_deg=76.0
camera.0.enabled=true
camera.0.gps_lat=48.826132
camera.0.gps_lon=2.365856
camera.0.gps_alt=58.524
camera.0.heading_deg=164.0
camera.0.elevation_deg=0.0
# detection tuning (defaults shown)
camera.0.diff_threshold=14
camera.0.bg_learn_rate=0.05
camera.0.adaptive_k=2.2
camera.0.blur_radius=1
camera.0.morph_open=1
camera.0.morph_close=2
camera.0.min_blob_area=12
camera.0.min_blob_fill_ratio=0.10
camera.0.max_blob_area_ratio=0.45
camera.0.border_ignore_px=6
camera.0.confirm_m=2
camera.0.confirm_n=3
