x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  vps-server:
    <<: *hardening
    build:
      context: ./vps
      dockerfile: Dockerfile
    container_name: pavois-vps-server
    ports:
      - "41234:41234/udp"
      - "127.0.0.1:3002:3002/tcp"
    env_file:
      - ./vps/.env
    environment:
      ALERTS_DATA_DIR: /app/data
    volumes:
      - pavois-data:/app/data
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0

  frontend-angular:
    <<: *hardening
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: pavois-frontend-angular
    depends_on:
      - vps-server
    environment:
      PAVOIS_API_URL: ${PAVOIS_API_URL:-}
      PAVOIS_WS_BASE_URL: ${PAVOIS_WS_BASE_URL:-}
    ports:
      - "8080:8080/tcp"
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.5

volumes:
  pavois-data:
