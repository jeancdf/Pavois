<header class="top-bar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 22 22" fill="none" aria-hidden="true">
      <polygon points="11,2 20,7 20,15 11,20 2,15 2,7" fill="#3B82F6" opacity="0.15" stroke="#3B82F6" stroke-width="1.5" />
      <polygon points="11,5 17,8.5 17,13.5 11,17 5,13.5 5,8.5" fill="#3B82F6" opacity="0.3" />
      <circle cx="11" cy="11" r="2.5" fill="#3B82F6" />
    </svg>
    <span class="brand-name">PAVOIS</span>
  </div>

  <nav class="top-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Carte</a>
    <a routerLink="/test-rail" routerLinkActive="active">Test rail</a>
  </nav>

  <div class="kpis">
    <div class="kpi">
      <span class="kpi-label">DÉTECTIONS</span>
      <span class="kpi-value">{{ realtime.totalDetections() }}</span>
    </div>
    <div class="kpi-sep"></div>
    <div class="kpi">
      <span class="kpi-label">PISTES</span>
      <span class="kpi-value kpi-tracks">{{ realtime.activeTrackCount() }}</span>
    </div>
    <div class="kpi-sep"></div>
    <div class="kpi">
      <span class="kpi-label">IMU</span>
      <span
        class="kpi-value"
        [class.kpi-warn]="imuTrustedCount() < imuLiveCount()"
        title="IMU calibrées / IMU actives"
      >{{ imuTrustedCount() }}/{{ imuLiveCount() }}</span>
    </div>
    <div class="kpi-sep"></div>
    <div class="kpi">
      <span class="kpi-label">PREVIEW</span>
      <span class="kpi-value">{{ previewLiveCount() }}</span>
    </div>
    <div class="kpi-sep"></div>
    <div class="kpi">
      <span class="kpi-label">UPTIME</span>
      <span class="kpi-value">{{ formatUptime(uptime()) }}</span>
    </div>
  </div>

  <div class="conn-indicator" [class.conn-ok]="realtime.connected()" [class.conn-down]="!realtime.connected()">
    <span class="conn-dot"></span>
    <span class="conn-label">{{ realtime.connected() ? 'WS CONNECTÉ' : 'HORS LIGNE' }}</span>
  </div>
</header>
