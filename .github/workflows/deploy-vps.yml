name: Deploy VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: Test the VPS backend
        working-directory: vps
        run: |
          npm i
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Test the Angular frontend
        working-directory: frontend-angular
        run: |
          npm i --legacy-peer-deps
          npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Write VPS SSH key
        env:
          SSH_KEY_JSON: ${{ toJSON(secrets.VPS_SSH_KEY) }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          raw = os.environ.get("SSH_KEY_JSON") or ""
          if raw in ("null", "undefined"):
              raw = ""
          try:
              parsed = json.loads(raw) if raw else ""
          except json.JSONDecodeError:
              parsed = raw
          key = parsed if isinstance(parsed, str) else ""
          key = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if "\n" not in key:
              key = key.replace("\\n", "\n")
          if not key:
              sys.stderr.write("Secret VPS_SSH_KEY vide.\n")
              sys.exit(1)
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              sys.stderr.write("VPS_SSH_KEY n'est pas une clé privée PEM/OpenSSH.\n")
              sys.exit(1)
          key += "\n"

          ssh_dir = pathlib.Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          path = ssh_dir / "vps_deploy"
          path.write_text(key, encoding="utf-8")
          path.chmod(0o600)
          info = subprocess.check_output(
              ["ssh-keygen", "-l", "-f", str(path)],
              text=True,
          ).strip()
          print(f"Clé SSH écrite ({len(key)} octets) : {info}")
          PY
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
          DISCORD_CATEGORIES: ${{ vars.DISCORD_CATEGORIES }}
          DISCORD_MAX_ALERTS_PER_MIN: ${{ vars.DISCORD_MAX_ALERTS_PER_MIN }}
          DISCORD_MENTION_ROLE_ID: ${{ vars.DISCORD_MENTION_ROLE_ID }}
          DISCORD_INCLUDE_POSITION: ${{ vars.DISCORD_INCLUDE_POSITION }}
          DISCORD_ENV_LABEL: ${{ vars.DISCORD_ENV_LABEL }}
          OPERATOR_URL: ${{ vars.OPERATOR_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key_path: /home/runner/.ssh/vps_deploy
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DISCORD_WEBHOOK_URL,DISCORD_ENABLED,DISCORD_CATEGORIES,DISCORD_MAX_ALERTS_PER_MIN,DISCORD_MENTION_ROLE_ID,DISCORD_INCLUDE_POSITION,DISCORD_ENV_LABEL,OPERATOR_URL
          script_stop: true
          script: |
            set -euo pipefail
            BASE_APP_DIR="${{ secrets.VPS_APP_DIR }}"
            BRANCH="${{ github.ref_name }}"

            if [ -z "$BASE_APP_DIR" ]; then
              echo "VPS_APP_DIR secret is required" >&2
              exit 1
            fi

            TARGET_DIR="${BASE_APP_DIR}"
            COMPOSE_FILE="docker-compose.yml"

            echo "--> Déploiement de la branche '$BRANCH' dans '$TARGET_DIR' avec $COMPOSE_FILE"

            # S'assurer que le dossier cible est un dépôt Git valide
            if [ ! -d "$TARGET_DIR/.git" ]; then
              echo "--> Clonage du dépôt dans '$TARGET_DIR'..."
              rm -rf "$TARGET_DIR"
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$TARGET_DIR" || git clone "git@github.com:${{ github.repository }}.git" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            if [ ! -d ".git" ]; then
              echo "Erreur : '$TARGET_DIR' n'est pas un dépôt Git valide." >&2
              exit 1
            fi

            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" 2>/dev/null || true
            git fetch --all --prune
            git checkout "$BRANCH" || git checkout -b "$BRANCH" "origin/$BRANCH"
            git pull origin "$BRANCH"

            # Écriture sécurisée des variables Discord dans vps/.env (mise à jour sélective sans écraser le reste)
            python3 <<'PY'
            import os
            from pathlib import Path

            vps_dir = Path("vps")
            vps_dir.mkdir(exist_ok=True)
            env_path = vps_dir / ".env"
            example_path = vps_dir / ".env.example"

            if not env_path.exists():
                if example_path.exists():
                    env_path.write_text(example_path.read_text(encoding="utf-8"), encoding="utf-8")
                else:
                    env_path.touch()

            discord_vars = {
                "DISCORD_WEBHOOK_URL": os.environ.get("DISCORD_WEBHOOK_URL", ""),
                "DISCORD_ENABLED": os.environ.get("DISCORD_ENABLED", ""),
                "DISCORD_CATEGORIES": os.environ.get("DISCORD_CATEGORIES", ""),
                "DISCORD_MAX_ALERTS_PER_MIN": os.environ.get("DISCORD_MAX_ALERTS_PER_MIN", ""),
                "DISCORD_MENTION_ROLE_ID": os.environ.get("DISCORD_MENTION_ROLE_ID", ""),
                "DISCORD_INCLUDE_POSITION": os.environ.get("DISCORD_INCLUDE_POSITION", ""),
                "DISCORD_ENV_LABEL": os.environ.get("DISCORD_ENV_LABEL", ""),
                "OPERATOR_URL": os.environ.get("OPERATOR_URL", ""),
            }

            updates = {k: v for k, v in discord_vars.items() if v}

            lines = env_path.read_text(encoding="utf-8").splitlines() if env_path.exists() else []
            updated_lines = []
            seen_keys = set()

            for line in lines:
                stripped = line.strip()
                if stripped.startswith("#") or "=" not in stripped:
                    updated_lines.append(line)
                    continue
                key = stripped.split("=", 1)[0].strip()
                if key in updates:
                    updated_lines.append(f'{key}="{updates[key]}"')
                    seen_keys.add(key)
                elif key in discord_vars:
                    updated_lines.append(line)
                    seen_keys.add(key)
                else:
                    updated_lines.append(line)

            for key, val in updates.items():
                if key not in seen_keys:
                    updated_lines.append(f'{key}="{val}"')

            env_path.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")
            env_path.chmod(0o600)
            PY

            chmod +x scripts/deploy_vps.sh frontend-angular/docker-entrypoint.d/40-env-js.sh 2>/dev/null || true
            COMPOSE_FILE="$COMPOSE_FILE" APP_DIR="$TARGET_DIR" ./scripts/deploy_vps.sh

            echo "--> Vérification des logs du conteneur VPS..."
            DOCKER_CMD="docker"
            if ! docker info >/dev/null 2>&1; then
              DOCKER_CMD="sudo docker"
            fi
            $DOCKER_CMD compose -f "$COMPOSE_FILE" logs --tail=50 vps-server | grep -E "Discord :" || true

