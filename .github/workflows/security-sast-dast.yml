name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: VPS unit tests
        working-directory: vps
        run: |
          npm ci
          npm test
      - name: Detector self-test
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          cmake -S pavois++ -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target pavois_selftest --parallel 2
          ./build/pavois_selftest

  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: semgrep scan --config auto --severity ERROR --error

  trivy-repo:
    name: SCA - Trivy dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  trivy-images:
    name: SCA - Trivy image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [vps, frontend-angular]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t pavois-${{ matrix.image }}:ci ./${{ matrix.image }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pavois-${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  zap:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://51.91.98.159:8081'
          cmd_options: '-a'
          issue_title: 'DAST - OWASP ZAP baseline'
          fail_action: false
