server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    # Docker's embedded DNS. proxy_pass through a variable makes nginx look
    # vps-server up again (every 10 s at most) instead of once at start-up,
    # so a deploy that recreates the backend with a new address no longer
    # leaves the interface on HTTP 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://vps-server:3002;

    location = /api {
        proxy_pass http://vps-server:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://vps-server:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /env.js {
        alias /tmp/env.js;
    }

    # Same-origin WebSocket so the browser does not need port 3002/3003.
    # Staging publishes the API on 3003; the UI is on 8081.
    location = /ws {
        proxy_pass http://vps-server:3002/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
