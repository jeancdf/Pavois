name: Deploy OVH VPS (Achraf)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vps/package-lock.json
      - name: Test the VPS backend
        working-directory: vps
        run: |
          npm ci
          npm test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json
      - name: Test the Angular frontend
        working-directory: frontend-angular
        run: |
          npm ci --legacy-peer-deps
          npm test

  deploy-ovh:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Une clé OpenSSH brute dans `env:` est coupée au premier saut de
      # ligne : OVH_KEY arrivait vide alors que le secret existait.
      # toJSON garde la clé sur une seule ligne, puis on reconstitue le PEM.
      - name: Write OVH SSH key
        env:
          SSH_KEY_JSON: ${{ toJSON(secrets.OVH_VPS_SSH_KEY) }}
        run: |
          python3 <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          raw = os.environ.get("SSH_KEY_JSON") or ""
          try:
              key = json.loads(raw) if raw else ""
          except json.JSONDecodeError:
              key = raw
          if not isinstance(key, str):
              key = ""
          key = key.replace("\r\n", "\n").replace("\r", "\n").strip()
          if "\n" not in key:
              key = key.replace("\\n", "\n")
          if not key.strip():
              sys.stderr.write(
                  "Secret OVH_VPS_SSH_KEY vide.\n"
              )
              sys.exit(1)
          if "BEGIN" not in key or "PRIVATE KEY" not in key:
              sys.stderr.write(
                  "OVH_VPS_SSH_KEY n'est pas une clé privée PEM/OpenSSH.\n"
              )
              sys.exit(1)
          if not key.endswith("\n"):
              key += "\n"
          ssh_dir = pathlib.Path.home() / ".ssh"
          ssh_dir.mkdir(mode=0o700, exist_ok=True)
          path = ssh_dir / "ovh_deploy"
          path.write_text(key, encoding="utf-8")
          path.chmod(0o600)
          info = subprocess.check_output(
              ["ssh-keygen", "-l", "-f", str(path)],
              text=True,
          ).strip()
          print(f"Clé SSH écrite ({len(key)} octets) : {info}")
          PY
      - name: Deploy to Achraf OVH VPS over SSH
        env:
          HOST: ${{ secrets.OVH_VPS_HOST || '51.91.98.159' }}
          SSH_USER: ${{ secrets.OVH_VPS_USER || 'ubuntu' }}
          PORT: ${{ secrets.OVH_VPS_PORT || 22 }}
          APP_DIR: ${{ secrets.OVH_VPS_APP_DIR || '/home/ubuntu/Pavois' }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WS_AUTH_TOKEN: ${{ secrets.WS_AUTH_TOKEN }}
          UDP_HMAC_SECRET: ${{ secrets.UDP_HMAC_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ENABLED: ${{ vars.DISCORD_ENABLED }}
          DISCORD_CATEGORIES: ${{ vars.DISCORD_CATEGORIES }}
          DISCORD_MAX_ALERTS_PER_MIN: ${{ vars.DISCORD_MAX_ALERTS_PER_MIN }}
          DISCORD_MENTION_ROLE_ID: ${{ vars.DISCORD_MENTION_ROLE_ID }}
          DISCORD_INCLUDE_POSITION: ${{ vars.DISCORD_INCLUDE_POSITION }}
          DISCORD_ENV_LABEL: ${{ vars.DISCORD_ENV_LABEL }}
          OPERATOR_URL: ${{ vars.OPERATOR_URL }}
        run: |
          set -euo pipefail
          : "${WS_AUTH_TOKEN:?Secret GitHub WS_AUTH_TOKEN manquant}"
          : "${UDP_HMAC_SECRET:?Secret GitHub UDP_HMAC_SECRET manquant}"
          if [ "${#WS_AUTH_TOKEN}" -lt 24 ] || [ "${#UDP_HMAC_SECRET}" -lt 32 ]; then
            echo "WS_AUTH_TOKEN (24) ou UDP_HMAC_SECRET (32) trop court" >&2
            exit 1
          fi
          HOST="${HOST//$'\r'/}"
          SSH_USER="${SSH_USER//$'\r'/}"
          PORT="${PORT//$'\r'/}"
          APP_DIR="${APP_DIR//$'\r'/}"
          HOST="${HOST#"${HOST%%[![:space:]]*}"}"
          HOST="${HOST%"${HOST##*[![:space:]]}"}"
          SSH_USER="${SSH_USER#"${SSH_USER%%[![:space:]]*}"}"
          SSH_USER="${SSH_USER%"${SSH_USER##*[![:space:]]}"}"
          PORT="${PORT#"${PORT%%[![:space:]]*}"}"
          PORT="${PORT%"${PORT##*[![:space:]]}"}"
          echo "SSH ${SSH_USER}@${HOST} port=${PORT}"
          {
            for name in APP_DIR BRANCH GH_TOKEN REPO WS_AUTH_TOKEN UDP_HMAC_SECRET \
                DISCORD_WEBHOOK_URL DISCORD_ENABLED DISCORD_CATEGORIES DISCORD_MAX_ALERTS_PER_MIN DISCORD_MENTION_ROLE_ID \
                DISCORD_INCLUDE_POSITION DISCORD_ENV_LABEL OPERATOR_URL; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            cat <<'REMOTE'
          set -euo pipefail
          echo "--> Déploiement de la branche '$BRANCH' sur le VPS OVH..."

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
              clone "https://github.com/${REPO}.git" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git remote set-url origin "https://github.com/${REPO}.git"
          git -c "http.extraHeader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            fetch origin
          git checkout -f -B "$BRANCH" "origin/$BRANCH"

          [ -f vps/.env.staging ] || cp vps/.env.staging.example vps/.env.staging
          bash scripts/write_env.sh vps/.env.staging \
            WS_AUTH_TOKEN UDP_HMAC_SECRET DISCORD_WEBHOOK_URL \
            DISCORD_ENABLED DISCORD_CATEGORIES DISCORD_MAX_ALERTS_PER_MIN DISCORD_MENTION_ROLE_ID \
            DISCORD_INCLUDE_POSITION DISCORD_ENV_LABEL OPERATOR_URL

          bash scripts/deploy_staging.sh

          DOCKER_CMD="docker"
          docker info >/dev/null 2>&1 || DOCKER_CMD="sudo docker"
          $DOCKER_CMD compose -f docker-compose.staging.yml logs --tail=50 vps-server-staging | grep -E "Discord :" || true
          REMOTE
          } | ssh -i "${HOME}/.ssh/ovh_deploy" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=accept-new \
            -p "${PORT}" \
            "${SSH_USER}@${HOST}" \
            bash -s
