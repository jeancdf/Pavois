@if (!auth.isAuthenticated()) {
  <app-login></app-login>
} @else {
  <div class="app-shell">
    <app-top-bar></app-top-bar>
    <div class="app-body">
      <app-sidebar></app-sidebar>
      <main class="main-content">
        <router-outlet />
      </main>
    </div>
  </div>

  @if (trackSelection.selectedTrackId()) {
    <app-track-detail></app-track-detail>
  }

  <app-toast></app-toast>
}
