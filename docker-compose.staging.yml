x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  vps-server-staging:
    <<: *hardening
    build:
      context: ./vps
      dockerfile: Dockerfile
    container_name: pavois-vps-staging
    ports:
      - "41235:41234/udp"
      - "41234:41234/udp"
      - "127.0.0.1:3003:3002/tcp"
    env_file:
      - ./vps/.env.staging
    volumes:
      - pavois-staging-data:/app/data
    networks:
      staging-net:
        aliases:
          - vps-server
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 1.0

  frontend-angular-staging:
    <<: *hardening
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: pavois-frontend-staging
    depends_on:
      - vps-server-staging
    networks:
      - staging-net
    environment:
      PAVOIS_API_URL: ${PAVOIS_API_URL:-}
      PAVOIS_WS_BASE_URL: ""
    ports:
      - "8081:8080/tcp"
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    mem_limit: 256m
    cpus: 0.5

networks:
  staging-net:
    driver: bridge

volumes:
  pavois-staging-data:
